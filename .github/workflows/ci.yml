name: Validate and build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install check tools
        run: |
          python -m pip install 'bandit==1.9.4' 'jinja2==3.1.6' 'ruff==0.17.6' 'dnspython==2.9.2'
          sudo apt-get update
          # The integration tests launch their own PowerDNS process.
          sudo systemctl mask pdns.service
          sudo apt-get install -y php-cli shellcheck libxml2-utils bind9 unbound pdns-server pdns-backend-sqlite3
      - name: Validate Python and run tests
        run: |
          ruff check src tests
          bandit -r src
          python -m unittest discover -s tests -v
      - name: Verify DNS delegation with BIND, PowerDNS and Unbound
        run: |
          # Use isolated binaries so the distribution service's AppArmor profile
          # does not restrict BIND to its installed configuration directory.
          fixture_bin="$RUNNER_TEMP/catalog-dns-bin"
          mkdir "$fixture_bin"
          for tool in named unbound unbound-checkconf unbound-control; do
            install -m 0755 "$(command -v "$tool")" "$fixture_bin/$tool"
          done
          sudo unshare --net sh -ec '
            ip link set lo up
            export CATALOG_DNS_INTEGRATION=1 CATALOG_POWERDNS_INTEGRATION=1
            PATH="$2:$PATH" exec "$1" -m unittest discover -s tests -p test_delegation.py -v
          ' sh "$(command -v python)" "$fixture_bin"
      - name: Validate PHP, XML and shell files
        run: |
          find src -type f \( -name '*.php' -o -name '*.inc' \) -print0 | xargs -0 -n 1 php -l
          find src -type f -name '*.xml' -print0 | xargs -0 -n 1 xmllint --noout
          shellcheck -s sh src/etc/rc.d/unbound_catalog \
            src/opnsense/scripts/OPNsense/UnboundCatalog/service.sh \
            +PRE_DEINSTALL.pre +POST_DEINSTALL.post +POST_INSTALL.post scripts/build-package.sh

  package:
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build on FreeBSD 15.1 amd64
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1
        with:
          release: '15.1'
          arch: x86_64
          prepare: pkg install -y git
          run: sh scripts/build-package.sh --fetch-deps
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: os-unbound-catalog-FreeBSD-15-amd64
          path: dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: os-unbound-catalog-FreeBSD-15-amd64
          path: dist/
      - name: Publish the verified native package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          version=$(awk '$1 == "PLUGIN_VERSION=" { print $2 }' Makefile)
          test "$GITHUB_REF_NAME" = "v$version"
          package="os-unbound-catalog-$version.pkg"
          (cd dist && sha256sum -c "$package.sha256")
          gh release create "$GITHUB_REF_NAME" "dist/$package" "dist/$package.sha256" \
            --verify-tag --generate-notes
