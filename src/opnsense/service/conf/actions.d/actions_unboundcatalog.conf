[start]
command:/usr/local/opnsense/scripts/OPNsense/UnboundCatalog/service.sh start
parameters:
type:script
message:Starting Catalog Sync
allowed_groups:wheel,wwwonly

[stop]
command:/usr/local/opnsense/scripts/OPNsense/UnboundCatalog/service.sh stop
parameters:
type:script
message:Stopping Catalog Sync
allowed_groups:wheel,wwwonly

[restart]
command:/usr/local/opnsense/scripts/OPNsense/UnboundCatalog/service.sh restart
parameters:
type:script
message:Restarting Catalog Sync
allowed_groups:wheel,wwwonly

[apply]
command:/usr/local/opnsense/scripts/OPNsense/UnboundCatalog/service.sh apply
parameters:
type:script
message:Applying Catalog Sync settings
allowed_groups:wheel,wwwonly

[status]
command:/usr/local/opnsense/scripts/OPNsense/UnboundCatalog/service.sh status
parameters:
type:script_output
errors:no
message:Reading Catalog Sync service status
allowed_groups:wheel,wwwonly

[uptime]
command:/usr/local/opnsense/scripts/OPNsense/UnboundCatalog/service.sh uptime
parameters:
type:script_output
errors:no
message:Reading Catalog Sync worker uptime
allowed_groups:wheel,wwwonly

[reconcile]
command:/usr/local/bin/python3.13 -I /usr/local/opnsense/scripts/OPNsense/UnboundCatalog/resolver_service.py reconcile
parameters:
type:script
allowed_groups:wheel,nobody
